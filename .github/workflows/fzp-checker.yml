name: fzp-checker

# Dev-only Python tool (stack mode tooling.python=dev-only): the vendored Fritzing part
# checker under tools/fzp-checker, run with uv. Standard test.python-black-pytest-uv:
# locked sync, black --check, pytest. Also runs the checker over every example part so
# a regression in the compiler's output shows up here, not in Fritzing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fzp-checker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fzp-checker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/fzp-checker/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run black --check .
      - run: uv run pytest -q

      # Every example part must compile, pass the structural validator and the vendored
      # Fritzing checker (the golden-file tests cover the compiler; this covers the checker).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: node --import tsx scripts/check-examples.ts
        working-directory: .
